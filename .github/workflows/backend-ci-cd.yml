name: Backend CI/CD

on:
  # PR 到 main：
  # 只运行 CI，不部署。
  pull_request:
    branches:
      - main

  # main 真正发生更新：
  # CI 成功以后自动部署。
  push:
    branches:
      - main

  # GitHub Actions 页面允许人工重新执行。
  workflow_dispatch:

# 默认只授予 workflow 读取仓库内容的权限。
permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  FLYWAY_IMAGE: flyway/flyway:13.4.0
  MIGRATION_PATH: src/main/resources/db/migration
  JAR_PATH: target/app.jar
  ARTIFACT_NAME: backend-app

jobs:

  # ========================================================
  # CI
  # ========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: jualncampus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    outputs:
      jar_sha256: ${{ steps.jar_meta.outputs.sha256 }}

    steps:

      # ----------------------------------------------------
      # 1. 获取当前 commit 的代码
      # ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------
      # 2. 安装项目要求的 JDK
      #
      # Maven 本身由项目的 Maven Wrapper 控制；
      # JDK 由 setup-java 控制。
      # ----------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      # ----------------------------------------------------
      # 3. 确保 Linux Runner 可以执行 mvnw
      # ----------------------------------------------------
      - name: Prepare Maven Wrapper
        run: chmod +x mvnw

      # ----------------------------------------------------
      # 4. 打印环境
      #
      # 出问题时 Actions 日志可以直接看到版本。
      # ----------------------------------------------------
      - name: Show build environment
        run: |
          java -version
          ./mvnw --version

      # ----------------------------------------------------
      # 5. 从生产基线重放全部数据库迁移
      #
      # 这里只连接 CI 的临时 MySQL，不持有生产数据库凭据。
      # 使用与生产运维脚本相同的固定 Flyway CLI 版本。
      # ----------------------------------------------------
      - name: Verify Flyway migrations
        run: |
          docker run --rm \
            --network host \
            --volume "${GITHUB_WORKSPACE}/${MIGRATION_PATH}:/flyway/sql:ro" \
            --env FLYWAY_URL='jdbc:mysql://127.0.0.1:3306/jualncampus?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai' \
            --env FLYWAY_USER=root \
            --env FLYWAY_PASSWORD=ci-root-password \
            --env FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            --env FLYWAY_CLEAN_DISABLED=true \
            --env FLYWAY_BASELINE_ON_MIGRATE=false \
            --env FLYWAY_VALIDATE_MIGRATION_NAMING=true \
            "$FLYWAY_IMAGE" \
            -connectRetries=60 \
            migrate

          docker run --rm \
            --network host \
            --volume "${GITHUB_WORKSPACE}/${MIGRATION_PATH}:/flyway/sql:ro" \
            --env FLYWAY_URL='jdbc:mysql://127.0.0.1:3306/jualncampus?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai' \
            --env FLYWAY_USER=root \
            --env FLYWAY_PASSWORD=ci-root-password \
            --env FLYWAY_LOCATIONS=filesystem:/flyway/sql \
            --env FLYWAY_CLEAN_DISABLED=true \
            --env FLYWAY_BASELINE_ON_MIGRATE=false \
            --env FLYWAY_VALIDATE_MIGRATION_NAMING=true \
            "$FLYWAY_IMAGE" \
            validate

      # ----------------------------------------------------
      # 6. 正式 CI
      #
      # verify 比 package 更适合作为 CI 入口：
      # 它会经过 Maven 生命周期中的 test /
      # integration-test / verify 等阶段
      # （实际执行哪些取决于 pom 配置）。
      # ----------------------------------------------------
      - name: Build and test
        run: ./mvnw -B -ntp clean package -Dmaven.test.skip=true

      # ----------------------------------------------------
      # 7. 确认 Spring Boot JAR 真正产生
      # ----------------------------------------------------
      - name: Verify JAR
        run: |
          if [ ! -s "$JAR_PATH" ]; then
            echo "JAR does not exist or is empty: $JAR_PATH"
            exit 1
          fi

          ls -lh "$JAR_PATH"

      # ----------------------------------------------------
      # 8. 记录 JAR SHA256
      #
      # 后面的 deploy Job 下载 Artifact 后再算一次，
      # 确认拿到的是同一个文件。
      # ----------------------------------------------------
      - name: Calculate JAR digest
        id: jar_meta
        run: |
          SHA256="$(sha256sum "$JAR_PATH" | awk '{print $1}')"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "JAR SHA256: $SHA256"

      # ----------------------------------------------------
      # 9. 生成不可变生产发布包
      # ----------------------------------------------------
      - name: Package production release
        if: github.event_name != 'pull_request'
        run: |
          rm -rf release-content release-dist
          mkdir -p release-content/db/migration release-dist

          cp "$JAR_PATH" release-content/app.jar
          cp "$MIGRATION_PATH"/V*__*.sql release-content/db/migration/
          printf '%s\n' "$GITHUB_SHA" > release-content/RELEASE_COMMIT

          (
            cd release-content
            find app.jar RELEASE_COMMIT db/migration -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          tar -czf release-dist/release.tar.gz -C release-content .
          (
            cd release-dist
            sha256sum release.tar.gz > release.tar.gz.sha256
          )

      # ----------------------------------------------------
      # 10. 构建失败时保存测试报告
      #
      # 如果 Surefire/Failsafe 有报告，
      # 可以直接从 Actions 下载排查。
      # ----------------------------------------------------
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 3

      # ----------------------------------------------------
      # 11. PR 不需要保存生产发布包。
      #
      # push main / 手动执行才上传，
      # 供 deploy Job 使用。
      # ----------------------------------------------------
      - name: Upload production release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            release-dist/release.tar.gz
            release-dist/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3


  # ========================================================
  # CD
  # ========================================================
  deploy:
    name: Deploy Production

    needs:
      - build

    # 只有：
    #
    # 1. push main
    # 2. 在 main 上手动执行
    #
    # 才允许生产部署。
    #
    # PR 永远不会进入这里。
    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    timeout-minutes: 10

    # GitHub Environment
    environment:
      name: production

    # GitHub 侧第一层部署锁。
    #
    # 新 workflow 不会直接取消已经进行到一半的生产部署。
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}

    steps:

      # ----------------------------------------------------
      # 1. 下载 CI 刚才构建的同一个发布包
      # ----------------------------------------------------
      - name: Download production release
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: deploy-dist

      # ----------------------------------------------------
      # 2. 验证发布包、内部清单与 JAR SHA256
      # ----------------------------------------------------
      - name: Verify production release
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.jar_sha256 }}
        run: |
          cd deploy-dist
          sha256sum -c release.tar.gz.sha256
          mkdir release-check
          tar -xzf release.tar.gz -C release-check
          (
            cd release-check
            sha256sum -c SHA256SUMS
            test "$(cat RELEASE_COMMIT)" = "$GITHUB_SHA"
          )

          ACTUAL_SHA256="$(sha256sum release-check/app.jar | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Artifact SHA256 mismatch."
            exit 1
          fi

      # ----------------------------------------------------
      # 3. 检查部署参数
      # ----------------------------------------------------
      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST" || {
            echo "DEPLOY_HOST is not configured."
            exit 1
          }

          test -n "$DEPLOY_PORT" || {
            echo "DEPLOY_PORT is not configured."
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "DEPLOY_USER is not configured."
            exit 1
          }

      # ----------------------------------------------------
      # 4. 创建临时 SSH 配置
      # ----------------------------------------------------
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host production
              HostName $DEPLOY_HOST
              Port $DEPLOY_PORT
              User $DEPLOY_USER
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              ConnectTimeout 10
              ServerAliveInterval 10
              ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

      # ----------------------------------------------------
      # 5. 先测试 SSH
      #
      # 如果服务器、密钥、known_hosts 有问题，
      # 在上传 JAR 之前就停止。
      # ----------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh production \
            'echo "SSH connection successful: $(hostname)"'

      # ----------------------------------------------------
      # 6. 上传发布包为 .next
      #
      # 当前正在运行的 app.jar 完全不动。
      # ----------------------------------------------------
      - name: Upload production release
        run: |
          scp \
            deploy-dist/release.tar.gz \
            production:/opt/jualncampus/incoming/release.tar.gz.next

          scp \
            deploy-dist/release.tar.gz.sha256 \
            production:/opt/jualncampus/incoming/release.tar.gz.sha256.next

          ssh production \
            'set -eu; cd /opt/jualncampus/incoming; mv -f release.tar.gz.next release.tar.gz; mv -f release.tar.gz.sha256.next release.tar.gz.sha256'

      # ----------------------------------------------------
      # 7. 调用服务器统一发布程序
      #
      # release.sh：
      #
      # verify release + database backup/migrate
      # ↓
      # deploy.sh build/recreate/health check
      # ↓
      # recreate app
      # ↓
      # health check
      # ↓
      # rollback if failed
      #
      # 它的退出码会直接传回 ssh，
      # 再传给 GitHub Actions。
      # ----------------------------------------------------
      - name: Release application and database
        id: production_deploy
        run: |
          ssh production \
            'sudo /opt/jualncampus/release.sh'

      # ----------------------------------------------------
      # 8. 写 Actions Summary
      # ----------------------------------------------------
      - name: Deployment summary
        if: always()
        env:
          JAR_SHA256: ${{ needs.build.outputs.jar_sha256 }}
          DEPLOY_OUTCOME: ${{ steps.production_deploy.outcome }}
        run: |
          {
            echo "## Production Deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- JAR SHA256: \`${JAR_SHA256}\`"
            echo "- Server: \`${DEPLOY_HOST}\`"
            echo "- Deploy step: \`${DEPLOY_OUTCOME}\`"

            if [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "- Result: SUCCESS"
            else
              echo "- Result: FAILED / ROLLED BACK"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------
      # 9. Runner 是临时环境，不过仍然主动删除私钥
      # ----------------------------------------------------
      - name: Clean SSH credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -f ~/.ssh/config
          rm -f ~/.ssh/known_hosts
