logging:
  level:
    # Only reviewed application/lifecycle categories opt into INFO in application.yaml.
    root: WARN

app:
  article:
    wechat-image-audit-enabled: true
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

wx:
  notification:
    environment: ${WX_NOTIFICATION_ENVIRONMENT:prod}
    mini-program:
      enabled: ${WX_NOTIFICATION_MINI_PROGRAM_ENABLED:true}
    official-account:
      enabled: ${WX_NOTIFICATION_OFFICIAL_ACCOUNT_ENABLED:false}
  ma:
    app-id: ${WX_MA_APP_ID}
    app-secret: ${WX_MA_APP_SECRET}
    token: ${WX_MA_TOKEN}
    encoding-aes-key: ${WX_MA_ENCODING_AES_KEY}

  mp:
    app-id: ${WX_MP_APP_ID}
    app-secret: ${WX_MP_APP_SECRET}
    token: ${WX_MP_TOKEN}
    encoding-aes-key: ${WX_MP_ENCODING_AES_KEY}
    domain: ${WX_MP_DOMAIN}

cos:
  secret-id: ${COS_SECRET_ID}
  secret-key: ${COS_SECRET_KEY}
  bucket: ${COS_BUCKET}
  region: ${COS_REGION}
  public-url-prefix: ${COS_PUBLIC_URL_PREFIX}
  presign-expire-seconds: 1800
  custom-domain: ${COS_CUSTOM_DOMAIN}

deep-seek:
  api-key: ${DEEP_SEEK_API_KEY}

sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
            - redis

spring:
  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
  data:
    redis:
      host: redis
      password: ${REDIS_PASSWORD}
