sa-token:
  token-name: Authorization # token 名称，默认 Authorization
  token-prefix: Bearer      # token 前缀，默认为空字符串
  timeout: 2592000          # token 有效期 30 天（秒）
  is-concurrent: true       # 允许多端同时登录
  is-share: false           # 每次登录生成新 token
  token-style: uuid
  is-print: false
  is-read-cookie: false
  is-read-body: false
  is-read-header: true
  is-write-header: false
  is-log: false

app:
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  article:
    # Optional deep format probe for Article and Points MP4; blank keeps header checks and video upload enabled.
    ffprobe-path: ${ARTICLE_FFPROBE_PATH:}
  points:
    # Environment-owned private storage. Never fall back to the public media bucket.
    private-bucket: ${COS_PRIVATE_BUCKET:}
    private-image-check-enabled: ${COS_IMAGE_CHECK_ENABLED:false}
  learning-task:
    # Enable only after this LearningTask private chain and supported consumers have been verified.
    private-bucket: ${COS_PRIVATE_BUCKET:}
    private-image-audit-enabled: ${COS_PRIVATE_IMAGE_AUDIT_ENABLED:false}

admin-auth:
  token-ttl: 8h
  qr-login-v2:
    # Reuses wx.ma credentials; the confirmation page and AppID have been confirmed.
    env-version: ${ADMIN_QR_LOGIN_ENV_VERSION:release}
    check-path: ${ADMIN_QR_LOGIN_CHECK_PATH:true}
    session-ttl: 2m
    retention: 5m
    poll-interval-ms: 1500
    create-ip-limit: 10
    create-global-limit: 60
    generation-concurrency: 4

document-import:
  stream-timeout: 5m
  ai-read-idle-timeout: 60s
  diagnostics-enabled: ${DOCUMENT_IMPORT_DIAGNOSTICS_ENABLED:false}
  diagnostics-directory: ${DOCUMENT_IMPORT_DIAGNOSTICS_DIRECTORY:target/document-import-samples}

async-processing:
  outbox:
    poll-interval: 2000
  job:
    poll-interval: 4000
    recovery-interval: 30000
  metrics:
    # Two aggregate MySQL queries plus one bounded Redis inspection per refresh.
    refresh-interval: 30000
  cleanup:
    cron: "0 25 4 * * *"
  stream:
    trim-cron: "0 40 4 * * *"

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deletedAt # logical delete field
      logic-delete-value: "NOW()" # value used when deleting
      logic-not-delete-value: "NULL" # value used when not deleted
      id-type: auto # auto-increment primary key strategy
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: cn.jualn.miniapp.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # SQL parameters can contain credentials, private source facts and user content, even in dev.
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  # Boot owns levels and environment overrides. Avoid global DEBUG and per-request INFO.
  group:
    requestlog: cn.jualn.miniapp.common.filter.RequestLogFilter
    providerlog: cn.jualn.miniapp.config.WebClientConfig
  level:
    root: INFO
    cn.jualn.miniapp: INFO
    org.springframework: WARN
    # Startup, web-server lifecycle and graceful shutdown are low-frequency operational evidence.
    org.springframework.boot: INFO
    com.zaxxer.hikari: INFO
    org.apache: WARN
    com.baomidou: WARN
    org.mybatis: WARN
    cn.dev33.satoken: WARN
    io.lettuce: WARN
    io.netty: WARN
    reactor.netty: WARN
    com.qcloud: WARN
    com.tencent.cloud: WARN
    # COS uses Apache HttpClient; wire/headers can expose credentials and signed URLs.
    org.apache.http.wire: "OFF"
    org.apache.http.headers: "OFF"
  structured:
    json:
      context:
        # Add only reviewed MDC/fluent fields in the native Boot customizer.
        include: false
      customizer: cn.jualn.miniapp.common.observability.LoggingJsonCustomizer
      stacktrace:
        printer: cn.jualn.miniapp.common.observability.SafeStackTracePrinter

server:
  port: 8080
  # 让 Spring Boot 正确识别 Nginx 转发过来的 HTTPS、真实 IP 等信息
  forward-headers-strategy: framework

  # 压缩配置，提升性能，减少带宽占用
  compression:
    enabled: true # 启用响应压缩
    min-response-size: 1024 # 只有响应体大于 1KB 的才压缩
    mime-types: # 压缩以下类型的响应
      - text/html # 压缩 HTML 内容
      - text/css # 压缩 CSS 文件
      - application/javascript # 压缩 JavaScript 文件
      - application/json # 压缩 JSON 数据
      - application/xml # 压缩 XML 数据
      - image/svg+xml # 压缩 SVG 图像
      - text/plain # 压缩纯文本内容

cos:
  private-bucket: ${COS_PRIVATE_BUCKET:}
  video-audit:
    enabled: ${COS_VIDEO_AUDIT_ENABLED:false}
    biz-type: ${COS_VIDEO_AUDIT_BIZ_TYPE:}
    policy-revision: ${COS_VIDEO_AUDIT_POLICY_REVISION:1}
    snapshot-interval-seconds: 1
    poll-interval-seconds: 30
    deadline-minutes: 120

people-qualification:
  encryption-key: ${PEOPLE_QUALIFICATION_ENCRYPTION_KEY:}
  match-key: ${PEOPLE_QUALIFICATION_MATCH_KEY:}
  student-number-namespace: ${PEOPLE_QUALIFICATION_STUDENT_NUMBER_NAMESPACE:CAMPUS_STUDENT_NUMBER}
  student-number-display-name: ${PEOPLE_QUALIFICATION_STUDENT_NUMBER_DISPLAY_NAME:学号}

spring:
  application:
    name: mini-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 默认使用 dev 配置
  main:
    banner-mode: off
    # 明确指定为 Servlet 应用，避免被误判为 Reactive 应用导致启动 Netty 服务器 跟Tomcat冲突无法启动
    web-application-type: servlet
  # Jackson global settings (overridden by JacksonConfig.java if needed)
  Jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 15s  # 最大等待 redis 响应时间，也就是执行 redis 指令后，10s后没有响应结果就报错
      connect-timeout: 5s # 客户端与 redis 建立连接的最大等待时间
      lettuce:
        pool:
          max-active: 8
          max-idle: 6
          min-idle: 2
          max-wait: 1500ms # 从连接池获取可用连接的最大等待时间
  datasource:
    #    关闭 SSL 连接（避免控制台报警告） 连接数据库时初始化字符集 Java 端用 UTF-8 编码即可安全存储 Emoji 等字符。JDBC 驱动会自动做编码转换
    url: jdbc:mysql://localhost:3306/jualncampus?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
      minimum-idle: 5       # 最小空闲连接
      maximum-pool-size: 10 # 最大连接数
      connection-timeout: 30000 # 获取连接超时 30s
      idle-timeout: 600000      # 空闲 10 分钟释放
      max-lifetime: 1800000     # 连接最大寿命 30 分钟
      auto-commit: true

